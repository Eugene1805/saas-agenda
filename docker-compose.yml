services:
  agenda-norte-db:
    image: postgres:17-alpine
    container_name: vital-agenda-norte-db
    environment:
      POSTGRES_DB: ${POSTGRES_NORTE_DB:-vital_agenda_norte}
      POSTGRES_USER: ${POSTGRES_NORTE_USER:-vital_agenda_norte}
      POSTGRES_PASSWORD: ${POSTGRES_NORTE_PASSWORD:?Set POSTGRES_NORTE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - agenda_norte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_NORTE_USER:-vital_agenda_norte} -d ${POSTGRES_NORTE_DB:-vital_agenda_norte}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agenda-valle-db:
    image: postgres:17-alpine
    container_name: vital-agenda-valle-db
    environment:
      POSTGRES_DB: ${POSTGRES_VALLE_DB:-vital_agenda_valle}
      POSTGRES_USER: ${POSTGRES_VALLE_USER:-vital_agenda_valle}
      POSTGRES_PASSWORD: ${POSTGRES_VALLE_PASSWORD:?Set POSTGRES_VALLE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - agenda_valle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_VALLE_USER:-vital_agenda_valle} -d ${POSTGRES_VALLE_DB:-vital_agenda_valle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agenda-aurora-db:
    image: postgres:17-alpine
    container_name: vital-agenda-aurora-db
    environment:
      POSTGRES_DB: ${POSTGRES_AURORA_DB:-vital_agenda_aurora}
      POSTGRES_USER: ${POSTGRES_AURORA_USER:-vital_agenda_aurora}
      POSTGRES_PASSWORD: ${POSTGRES_AURORA_PASSWORD:?Set POSTGRES_AURORA_PASSWORD in .env}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - agenda_aurora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_AURORA_USER:-vital_agenda_aurora} -d ${POSTGRES_AURORA_DB:-vital_agenda_aurora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agenda-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vital-agenda-api
    depends_on:
      agenda-norte-db:
        condition: service_healthy
      agenda-valle-db:
        condition: service_healthy
      agenda-aurora-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TenantDatabases__Connections__10000000-0000-0000-0000-000000000001: Host=agenda-norte-db;Port=5432;Database=${POSTGRES_NORTE_DB:-vital_agenda_norte};Username=${POSTGRES_NORTE_USER:-vital_agenda_norte};Password=${POSTGRES_NORTE_PASSWORD:?Set POSTGRES_NORTE_PASSWORD in .env}
      TenantDatabases__Connections__10000000-0000-0000-0000-000000000002: Host=agenda-valle-db;Port=5432;Database=${POSTGRES_VALLE_DB:-vital_agenda_valle};Username=${POSTGRES_VALLE_USER:-vital_agenda_valle};Password=${POSTGRES_VALLE_PASSWORD:?Set POSTGRES_VALLE_PASSWORD in .env}
      TenantDatabases__Connections__10000000-0000-0000-0000-000000000003: Host=agenda-aurora-db;Port=5432;Database=${POSTGRES_AURORA_DB:-vital_agenda_aurora};Username=${POSTGRES_AURORA_USER:-vital_agenda_aurora};Password=${POSTGRES_AURORA_PASSWORD:?Set POSTGRES_AURORA_PASSWORD in .env}
      Jwt__Issuer: saas-identity
      Jwt__Audience: vital-saas
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Ports__Http: 8080
      Platform__Mode: ${PLATFORM_MODE:-Local}
      AccessControl__Mode: ${ACCESS_CONTROL_MODE:-Local}
      Directory__Mode: ${DIRECTORY_MODE:-Local}
      SeedDemoData: ${SEED_DEMO_DATA:-false}
      OpenApi__Enabled: ${OPENAPI_ENABLED:-true}
    ports:
      - "127.0.0.1:8083:8080"

volumes:
  agenda_norte_pgdata:
  agenda_valle_pgdata:
  agenda_aurora_pgdata:
